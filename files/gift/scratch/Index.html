<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;color:#2b1b10;background:radial-gradient(900px 600px at 0% 0%,#ffe2b8 0%,transparent 60%),radial-gradient(900px 600px at 100% 100%,#ffc9d9 0%,transparent 55%),#fff6ec;min-height:100vh}
  main{max-width:440px;margin:0 auto;padding:28px 18px 40px}
  .badge{display:inline-block;font-size:12.5px;font-weight:900;letter-spacing:.08em;color:#b4541a;background:#fff;border:1.5px solid #f3c08f;border-radius:999px;padding:5px 12px}
  h1{font-size:30px;line-height:1.25;margin:12px 0 6px}
  h1 em{font-style:normal;color:#e4572e}
  .sub{color:#7a5a45;margin:0 0 18px}
  .card{background:#fff;border-radius:24px;padding:20px;box-shadow:0 18px 40px rgba(180,84,26,.15);border:1px solid #f6dcc4}
  label{display:block;font-weight:800;font-size:14px;margin:10px 0 6px}
  input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid #efd2b8;background:#fffaf5;font:inherit;font-size:17px;outline:none}
  input:focus{border-color:#e4572e}
  .btn{margin-top:16px;width:100%;padding:16px;border:0;border-radius:16px;font:inherit;font-weight:900;font-size:18px;color:#fff;cursor:pointer;background:linear-gradient(135deg,#ff7a45,#e4572e);box-shadow:0 10px 24px rgba(228,87,46,.35)}
  .btn:disabled{opacity:.6}
  .err{color:#c0392b;font-weight:700;margin-top:10px;min-height:1em}
  /* 복권 */
  #ticketWrap{display:none}
  .ticket{position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#fff,#fff3e6);border:2px dashed #f0b27a;padding:18px}
  .ticket .head{display:flex;justify-content:space-between;align-items:center;font-weight:900;color:#b4541a}
  .ticket .head span{font-size:12px;letter-spacing:.1em}
  .area{position:relative;margin-top:12px;height:220px;border-radius:16px;overflow:hidden}
  .prize{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(135deg,#fffbe6,#ffe9c7)}
  .prize .ic{font-size:64px}
  .prize b{font-size:26px;margin-top:6px}
  .prize p{margin:4px 0 0;color:#7a5a45}
  .prize.lose{background:linear-gradient(135deg,#f4f7ff,#e8eefc)}
  canvas#sc{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
  .hint{text-align:center;color:#7a5a45;font-weight:700;margin-top:10px}
  .after{display:none;text-align:center;margin-top:14px}
  .after b{display:block;font-size:20px}
  .after p{color:#7a5a45;margin:6px 0 0}
  /* 강사 현황판 */
  #board{display:none;max-width:1200px;margin:0 auto;padding:30px}
  .btop{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
  .btop h2{font-size:34px;margin:8px 0 4px}
  .btop .cnt{color:#7a5a45;font-size:18px}.btop .cnt b{color:#e4572e;font-size:28px}
  .qr{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:10px 14px;box-shadow:0 10px 24px rgba(180,84,26,.12)}
  .qr img{width:120px;height:120px}
  .qr small{color:#7a5a45;max-width:150px}
  .gs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin:22px 0}
  .g{background:#fff;border-radius:20px;padding:18px;box-shadow:0 10px 24px rgba(180,84,26,.1)}
  .g b{font-size:20px}.g .n{font-size:44px;font-weight:900;color:#e4572e}.g .n small{font-size:18px;color:#7a5a45;font-weight:700}
  .bar{height:12px;border-radius:999px;background:#f6e6d6;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff7a45,#e4572e)}
  .wl{display:flex;flex-wrap:wrap;gap:10px}
  .w{background:#fff;border-radius:16px;padding:12px 16px;box-shadow:0 8px 18px rgba(180,84,26,.1);font-size:18px;animation:pop .5s ease}
  .w b{color:#e4572e}
  @keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
  canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<main id="player">
  <span class="badge">🎟️ LUCKY TICKET</span>
  <h1>오늘 연수<br><em>행운 복권</em> 한 장</h1>
  <p class="sub">이름을 넣고 손가락으로 쓱쓱 긁어 보세요. 한 분당 한 장이에요.</p>
  <div class="card" id="formCard">
    <label for="nm">이름</label><input id="nm" placeholder="예: 홍길동" maxlength="20">
    <label for="dp">학과 (선택)</label><input id="dp" placeholder="예: 경영학과" maxlength="30">
    <button class="btn" id="go" type="button">🎟️ 복권 받기</button>
    <div class="err" id="err"></div>
  </div>
  <div id="ticketWrap">
    <div class="ticket">
      <div class="head">🎟️ 행운 복권 <span id="tname"></span></div>
      <div class="area" id="area">
        <div class="prize" id="prize"><div class="ic" id="pic">🎁</div><b id="pt"></b><p id="pp"></p></div>
        <canvas id="sc"></canvas>
      </div>
      <div class="hint" id="hint">👆 은색 부분을 손가락으로 긁어 주세요</div>
    </div>
    <div class="after" id="after"><b id="at"></b><p id="ap"></p></div>
  </div>
</main>
<div id="board">
  <div class="btop">
    <div><span class="badge">🎟️ LUCKY TICKET · 강사 화면</span><h2 id="bt">행운 복권</h2><div class="cnt">참여 <b id="played">0</b>명 · 당첨 <b id="won">0</b>명</div></div>
    <div class="qr"><img id="qr" alt="복권 QR"><small>📱 QR을 찍고<br>이름 넣고 긁어 보세요</small></div>
  </div>
  <div class="gs" id="gs"></div>
  <h3 style="margin:10px 0">🏆 당첨자</h3>
  <div class="wl" id="wl"></div>
</div>
<script>
  function $(i){return document.getElementById(i)}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  var R=null, revealed=false;

  $('go').onclick=function(){
    var b=this; b.disabled=true; $('err').textContent='';
    google.script.run.withSuccessHandler(function(r){
      b.disabled=false;
      if(!r.ok){ $('err').textContent=r.msg; return; }
      R=r; showTicket();
    }).withFailureHandler(function(e){ b.disabled=false; $('err').textContent='오류: '+e.message; })
      .play({name:$('nm').value, dept:$('dp').value});
  };
  function showTicket(){
    $('formCard').style.display='none'; $('ticketWrap').style.display='block';
    $('tname').textContent=$('nm').value+' 교수님';
    if(R.win){ $('pic').textContent='🎉'; $('pt').textContent='당첨되셨습니다!'; $('pp').textContent='어떤 선물일지는 강사에게 이 화면을 보여 주세요 🎁'; }
    else { $('prize').classList.add('lose'); $('pic').textContent='🍀'; $('pt').textContent='다음 기회에!'; $('pp').textContent='오늘의 행운은 연수에서 찾아가세요'; }
    setupScratch();
    if(R.again){ $('hint').textContent='이미 받으신 복권이에요. 결과를 다시 보여 드려요.'; }
  }
  function setupScratch(){
    var cv=$('sc'), area=$('area'), ctx=cv.getContext('2d'), dpr=window.devicePixelRatio||1;
    var w=area.clientWidth, h=area.clientHeight; cv.width=w*dpr; cv.height=h*dpr; ctx.scale(dpr,dpr);
    var g=ctx.createLinearGradient(0,0,w,h); g.addColorStop(0,'#cfd5de'); g.addColorStop(.5,'#eef1f5'); g.addColorStop(1,'#b9c1cc');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    ctx.fillStyle='rgba(120,130,145,.35)'; for(var i=0;i<260;i++){ ctx.fillRect(Math.random()*w,Math.random()*h,2,2); }
    ctx.fillStyle='#6b7280'; ctx.font='800 22px Pretendard, sans-serif'; ctx.textAlign='center'; ctx.fillText('✨ 여기를 긁어 주세요 ✨',w/2,h/2+8);
    ctx.globalCompositeOperation='destination-out';
    var down=false, moves=0;
    function pos(e){ var r=cv.getBoundingClientRect(), t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left,y:t.clientY-r.top}; }
    function scratch(e){ if(!down||revealed) return; e.preventDefault(); var p=pos(e); ctx.beginPath(); ctx.arc(p.x,p.y,24,0,Math.PI*2); ctx.fill(); if(++moves%12===0) check(); }
    function check(){
      var d=ctx.getImageData(0,0,cv.width,cv.height).data, clear=0, step=16*4;
      for(var i=3;i<d.length;i+=step){ if(d[i]===0) clear++; }
      if(clear/(d.length/step)>0.45) reveal();
    }
    ['mousedown','touchstart'].forEach(function(t){ cv.addEventListener(t,function(e){ down=true; scratch(e); },{passive:false}); });
    ['mousemove','touchmove'].forEach(function(t){ cv.addEventListener(t,scratch,{passive:false}); });
    ['mouseup','mouseleave','touchend'].forEach(function(t){ cv.addEventListener(t,function(){ down=false; }); });
  }
  function reveal(){
    if(revealed) return; revealed=true;
    var cv=$('sc'); cv.style.transition='opacity .5s'; cv.style.opacity=0; setTimeout(function(){ cv.style.display='none'; },500);
    $('hint').style.display='none'; $('after').style.display='block';
    if(R.win){ $('at').textContent='🎉 당첨되셨습니다!'; $('ap').textContent='쉬는 시간에 강사에게 이 화면을 보여 주세요. 선물은 그때 공개돼요!'; burst(220); if(navigator.vibrate) navigator.vibrate([80,40,120]); }
    else { $('at').textContent='🍀 아쉽지만 다음 기회에'; $('ap').textContent='참여해 주셔서 고마워요!'; }
  }

  /* 강사 현황판 */
  function startBoard(pw){
    $('player').style.display='none'; $('board').style.display='block'; document.body.style.background='#fff6ec';
    var lastWon=-1;
    function load(){ google.script.run.withSuccessHandler(function(r){
      if(!r.ok){ $('bt').textContent='🔒 '+r.msg; return; }
      $('bt').textContent=r.title; $('played').textContent=r.played; $('won').textContent=r.winners.length;
      if(!$('qr').src) $('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=240x240&margin=8&data='+encodeURIComponent(r.url);
      $('gs').innerHTML=r.gifts.map(function(g){ var pct=g.total?Math.round(g.left/g.total*100):0; return '<div class="g"><b>🎁 '+esc(g.name)+'</b><div class="n">'+g.left+'<small> / '+g.total+' 남음</small></div><div class="bar"><i style="width:'+pct+'%"></i></div></div>'; }).join('');
      $('wl').innerHTML=r.winners.length?r.winners.map(function(w){ return '<div class="w">🏆 <b>'+esc(w.name)+'</b> 교수님 · '+esc(w.gift)+'</div>'; }).join(''):'<p style="color:#7a5a45">아직 당첨자가 없어요. 두근두근…</p>';
      if(lastWon>=0 && r.winners.length>lastWon) burst(180);
      lastWon=r.winners.length;
    }).getBoard(pw); }
    load(); setInterval(load,4000);
  }

  /* 꽃가루 */
  var fx=$('fx'), cx=fx.getContext('2d'), P=[];
  function size(){ fx.width=innerWidth; fx.height=innerHeight; } size(); addEventListener('resize',size);
  function burst(n){ var col=['#ff7a45','#ffd978','#ff9bd2','#8fd3ff','#b6ff9b','#e4572e'];
    for(var k=0;k<n;k++) P.push({x:innerWidth/2+(Math.random()-.5)*160,y:innerHeight*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*15-5,r:Math.random()*5+4,c:col[k%col.length],a:Math.random()*6,s:(Math.random()-.5)*.3,life:200});
    if(!burst.on){ burst.on=true; requestAnimationFrame(step); } }
  function step(){ cx.clearRect(0,0,fx.width,fx.height); P=P.filter(function(p){ return p.life-->0&&p.y<fx.height+30; });
    P.forEach(function(p){ p.vy+=.35; p.x+=p.vx; p.y+=p.vy; p.a+=p.s; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a); cx.fillStyle=p.c; cx.fillRect(-p.r,-p.r/2,p.r*2,p.r); cx.restore(); });
    if(P.length) requestAnimationFrame(step); else { burst.on=false; cx.clearRect(0,0,fx.width,fx.height); } }

  google.script.url.getLocation(function(loc){ if(loc.parameter && loc.parameter.admin) startBoard(loc.parameter.admin); });
</script>
</body>
</html>
