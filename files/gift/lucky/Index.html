<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;color:#fff;background:radial-gradient(1200px 700px at 20% -10%,#3b2a7a 0%,transparent 60%),radial-gradient(900px 600px at 110% 110%,#7a2a5a 0%,transparent 55%),#0f1230;min-height:100%;overflow-x:hidden}
  .glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(600px 300px at 50% 0%,rgba(255,215,120,.18),transparent 70%)}
  /* ---------- 참가 화면 ---------- */
  #join{max-width:460px;margin:0 auto;padding:34px 20px}
  .badge{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.06em;color:#ffd978;border:1px solid rgba(255,217,120,.5);border-radius:999px;padding:5px 12px}
  h1{font-size:30px;line-height:1.25;margin:14px 0 8px}
  h1 em{font-style:normal;background:linear-gradient(90deg,#ffe08a,#ff9bd2);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:#c9c6ea;margin:0 0 22px}
  .card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);border-radius:22px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  label{display:block;font-weight:700;font-size:14px;margin:12px 0 6px;color:#e7e4ff}
  input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid rgba(255,255,255,.22);background:rgba(10,12,40,.5);color:#fff;font:inherit;font-size:17px;outline:none}
  input:focus{border-color:#ffd978}
  .btn{margin-top:18px;width:100%;padding:16px;border:0;border-radius:16px;font:inherit;font-weight:900;font-size:18px;cursor:pointer;color:#3a2500;background:linear-gradient(135deg,#ffe58f,#f5b93a 55%,#ffd56b);box-shadow:0 10px 30px rgba(245,185,58,.35)}
  .btn:disabled{opacity:.6}
  .done{display:none;text-align:center;padding:10px 0}
  .done .clover{font-size:72px;animation:pop .6s ease}
  .done b{display:block;font-size:22px;margin:8px 0}
  .done p{color:#c9c6ea;margin:4px 0}
  .err{color:#ffb3b3;font-weight:700;margin-top:10px;min-height:1em}
  @keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  /* ---------- 무대 화면 ---------- */
  #stage{display:none;min-height:100vh;padding:28px 34px;flex-direction:column}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
  .top h2{margin:6px 0 0;font-size:34px}
  .count{font-size:18px;color:#c9c6ea}.count b{font-size:30px;color:#ffd978}
  .qr{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:10px 14px}
  .qr img{width:110px;height:110px;border-radius:8px;background:#fff}
  .qr small{color:#c9c6ea;font-size:13px;max-width:150px}
  .gifts{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 6px}
  .gift{cursor:pointer;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;border-radius:16px;padding:10px 18px;font:inherit;font-weight:800;font-size:17px}
  .gift small{display:block;font-weight:600;color:#c9c6ea;font-size:13px}
  .gift.on{border-color:#ffd978;background:rgba(255,217,120,.16);box-shadow:0 0 24px rgba(255,217,120,.3)}
  .gift.out{opacity:.35;cursor:not-allowed}
  .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:20px 0}
  .slots{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;width:min(1200px,94vw)}
  .slots.multi .slot{width:min(360px,44vw);height:170px}
  .slots.multi .nm{font-size:clamp(34px,4.2vw,58px)}
  .slots.multi .dp{font-size:16px}
  .slot{flex-direction:column;position:relative;width:min(900px,90vw);height:200px;border-radius:30px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:2px solid rgba(255,217,120,.55);box-shadow:0 0 60px rgba(255,200,90,.25),inset 0 0 40px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .slot::before,.slot::after{content:"";position:absolute;left:0;right:0;height:50px;z-index:2;pointer-events:none}
  .slot::before{top:0;background:linear-gradient(#0f1230cc,transparent)}.slot::after{bottom:0;background:linear-gradient(transparent,#0f1230cc)}
  .nm{font-size:clamp(44px,7vw,96px);font-weight:900;letter-spacing:.02em;white-space:nowrap;z-index:1}
  .nm small{font-size:.45em;font-weight:700;color:#ffd978;margin-left:.3em}
  .dp{font-size:20px;color:#ffd978;min-height:1.3em;z-index:1;font-weight:700}
  #dept{font-size:22px;color:#c9c6ea;min-height:1.4em}
  .cnts{display:flex;gap:8px;align-items:center;color:#c9c6ea;font-weight:700}
  .cn{cursor:pointer;border:2px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;border-radius:999px;padding:8px 18px;font:inherit;font-weight:900;font-size:18px}
  .cn.on{border-color:#ffd978;background:rgba(255,217,120,.18)}
  .cn:disabled{opacity:.3;cursor:not-allowed}
  .slot.win{animation:winGlow 1.2s ease-in-out infinite}
  @keyframes winGlow{50%{box-shadow:0 0 110px rgba(255,210,100,.75),inset 0 0 40px rgba(0,0,0,.35)}}
  .go{padding:22px 64px;border:0;border-radius:999px;font:inherit;font-weight:900;font-size:28px;cursor:pointer;color:#3a2500;background:linear-gradient(135deg,#ffe58f,#f5b93a 55%,#ffd56b);box-shadow:0 14px 40px rgba(245,185,58,.45);transition:transform .12s}
  .go:hover{transform:translateY(-2px) scale(1.02)}.go:disabled{opacity:.5;cursor:wait;transform:none}
  .msg{color:#ffb3b3;font-weight:700;min-height:1.2em}
  .wins{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .w{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:8px 14px;font-size:16px}
  .w b{color:#ffd978}
  canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
  .lock{max-width:420px;margin:80px auto;text-align:center}
</style>
</head>
<body>
<div class="glow"></div>
<canvas id="fx"></canvas>

<!-- 참가 화면 -->
<div id="join">
  <span class="badge">🎁 LUCKY DRAW</span>
  <h1>오늘 연수<br><em>행운의 선물 추첨</em></h1>
  <p class="sub">이름만 넣으면 끝! 오전이 끝날 때 큰 화면에서 추첨해요.</p>
  <div class="card">
    <div id="form">
      <label for="nm">이름</label><input id="nm" placeholder="예: 홍길동" maxlength="20">
      <label for="dp">학과 (선택)</label><input id="dp" placeholder="예: 경영학과" maxlength="30">
      <button class="btn" id="reg" type="button">🍀 행운 등록하기</button>
      <div class="err" id="err"></div>
    </div>
    <div class="done" id="done"><div class="clover">🍀</div><b id="doneMsg">등록 완료!</b><p id="doneCnt"></p><p>화면을 닫아도 괜찮아요.</p></div>
  </div>
</div>

<!-- 무대 화면 (?admin=비밀번호) -->
<div id="stage">
  <div class="top">
    <div><span class="badge">🎁 LUCKY DRAW</span><h2 id="ttl">행운의 선물 추첨</h2><div class="count">참가 <b id="cnt">0</b>명 · 당첨 <b id="wcnt">0</b>명 <button type="button" id="rst" style="margin-left:6px;border:1px solid rgba(255,140,140,.45);background:rgba(255,120,120,.12);color:#ffd0d0;border-radius:999px;padding:4px 12px;font:inherit;font-size:14px;cursor:pointer">🔄 초기화</button><span id="ver" style="margin-left:8px;font-size:12px;opacity:.5"></span><button type="button" id="snd" style="margin-left:10px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:4px 12px;font:inherit;font-size:14px;cursor:pointer">🔊 소리 켜짐</button></div></div>
    <div class="qr"><img id="qr" alt="참가 QR"><small>📱 아직 등록 안 하신 분은<br>QR로 이름만 넣어 주세요</small></div>
  </div>
  <div class="gifts" id="gifts"></div>
  <div class="mid">
    <div class="cnts">한 번에 <button type="button" class="cn on" data-n="1">1명</button><button type="button" class="cn" data-n="2">2명</button><button type="button" class="cn" data-n="3">3명</button><button type="button" class="cn" data-n="5">5명</button></div>
    <div class="slots" id="slots"><div class="slot"><div class="nm">🎁</div><div class="dp"></div></div></div>
    <div id="dept"></div>
    <button class="go" id="go" type="button">🎉 추첨하기</button>
    <div class="msg" id="smsg"></div>
    <div class="wins" id="wins"></div>
  </div>
</div>
<div id="lock" class="lock" style="display:none"><h2>🔒</h2><p id="lockMsg"></p></div>

<script>
  var PW=null, ST=null, sel=null, spinning=false, N=1;
  function $(i){return document.getElementById(i)}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

  /* ---- 참가 ---- */
  $('reg').onclick=function(){
    var b=this; b.disabled=true; $('err').textContent='';
    google.script.run.withSuccessHandler(function(r){
      b.disabled=false;
      if(!r.ok){ $('err').textContent=r.msg; return; }
      $('form').style.display='none'; $('done').style.display='block';
      $('doneMsg').textContent=r.msg; $('doneCnt').textContent='지금까지 '+r.count+'분이 등록했어요'; sPop();
      burst(80);
    }).withFailureHandler(function(e){ b.disabled=false; $('err').textContent='오류: '+e.message; })
      .register({name:$('nm').value, dept:$('dp').value});
  };

  /* ---- 무대 ---- */
  function startStage(pw){
    PW=pw; $('join').style.display='none'; $('stage').style.display='flex';
    load(); setInterval(function(){ if(!spinning) load(); },5000);
  }
  function load(){
    google.script.run.withSuccessHandler(function(r){
      if(!r.ok){ $('stage').style.display='none'; $('lock').style.display='block'; $('lockMsg').textContent=r.msg; return; }
      ST=r; render();
    }).getStage(PW);
  }
  function render(){
    $('ttl').textContent=ST.title; if(ST.version) $('ver').textContent=ST.version; $('cnt').textContent=ST.people.length; $('wcnt').textContent=ST.wins.length;
    if(!$('qr').src) $('qr').src='https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data='+encodeURIComponent(ST.url);
    if(!sel || !ST.gifts.some(function(g){return g.name===sel && g.left>0})){
      var g=ST.gifts.filter(function(g){return g.left>0})[0]; sel=g?g.name:null;
    }
    $('gifts').innerHTML=ST.gifts.map(function(g){
      return '<button type="button" class="gift'+(g.name===sel?' on':'')+(g.left<=0?' out':'')+'" data-g="'+esc(g.name)+'">🎁 '+esc(g.name)+'<small>남은 '+g.left+' / '+g.total+'</small></button>';
    }).join('');
    $('wins').innerHTML=ST.wins.map(function(w){ return '<div class="w">🏆 <b>'+esc(w.name)+'</b> 교수님 · '+esc(w.gift)+'</div>'; }).join('');
    var g0=ST.gifts.filter(function(g){return g.name===sel})[0], wonN=ST.wins.length, poolN=ST.people.length-wonN, maxN=Math.min(g0?g0.left:0, Math.max(0,poolN));
    document.querySelectorAll('.cn').forEach(function(b){ var k=+b.getAttribute('data-n'); b.disabled=spinning||k>maxN; b.classList.toggle('on',k===N); });
    if(N>maxN && maxN>0){ N=[5,3,2,1].filter(function(k){return k<=maxN})[0]; document.querySelectorAll('.cn').forEach(function(b){ b.classList.toggle('on',+b.getAttribute('data-n')===N); }); }
    $('go').textContent='🎉 '+N+'명 추첨하기';
    $('go').disabled=!sel || spinning || maxN<1;
  }
  document.querySelector('.cnts').addEventListener('click',function(e){ var b=e.target.closest('.cn'); if(!b||b.disabled||spinning) return; N=+b.getAttribute('data-n'); render(); });
  $('gifts').addEventListener('click',function(e){
    var b=e.target.closest('.gift'); if(!b||b.classList.contains('out')||spinning) return;
    sel=b.getAttribute('data-g'); render();
  });
  function slotsFor(n){
    var w=$('slots'); w.className='slots'+(n>1?' multi':''); w.innerHTML='';
    for(var k=0;k<n;k++){ var d=document.createElement('div'); d.className='slot'; d.innerHTML='<div class="nm">🎁</div><div class="dp"></div>'; w.appendChild(d); }
    return [].slice.call(w.children);
  }
  $('go').onclick=function(){
    if(!sel||spinning) return;
    ac(); spinning=true; render(); $('smsg').textContent=''; $('dept').textContent='두구두구두구…';
    var names=ST.people.map(function(p){return p.name}); if(!names.length) names=['?'];
    var n=N, slots=slotsFor(n), result=null, t0=Date.now();
    var BASE=150, MIN_TIME=1200, STOP_GAP=600;   // 이름 바뀌는 간격(ms) · 최소 도는 시간 · 칸마다 멈추는 간격
    google.script.run.withSuccessHandler(function(r){ result=r; }).withFailureHandler(function(e){ result={ok:false,msg:e.message}; }).draw(PW, sel, n);
    var stopped=0;
    slots.forEach(function(el,k){
      var i=Math.floor(Math.random()*names.length)+k*3, delay=BASE, slowing=false;
      (function tick(){
        if(result && !result.ok){ if(k===0) finish(result); return; }
        if(!slowing && result && Date.now()-t0>MIN_TIME+k*STOP_GAP) slowing=true;
        if(slowing) delay*=1.3;
        if(slowing && delay>600){ land(el,k); return; }
        el.querySelector('.nm').innerHTML=esc(names[i++%names.length])+'<small>교수님</small>'; el.querySelector('.dp').textContent='';
        if(k===0) sTick();
        setTimeout(tick,delay);
      })();
    });
    function land(el,k){
      var w=result.winners[k];
      if(!w){ el.querySelector('.nm').textContent='—'; }
      else { el.querySelector('.nm').innerHTML=esc(w.name)+'<small>교수님</small>'; el.querySelector('.dp').textContent=w.dept||''; el.classList.add('win'); burst(n>1?90:200); sWin(); }
      if(++stopped===slots.length) finish(result);
    }
  };
  function finish(r){
    spinning=false;
    if(!r.ok){ slotsFor(1); $('dept').textContent=''; $('smsg').textContent=r.msg; render(); return; }
    $('dept').textContent='🎁 '+r.gift+' 당첨! 축하드려요 🎉';
    ST=r.stage; render(); if(r.winners.length>1) setTimeout(function(){ burst(260); },300);
  }

  /* ---- 소리 (파일 없이 브라우저가 만들어요) ---- */
  var AC=null, MUTE=false;
  function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
  function tone(f,t,d,type,vol){ var a=ac(); if(!a||MUTE) return; var o=a.createOscillator(), g=a.createGain(); o.type=type||'square'; o.frequency.setValueAtTime(f,a.currentTime+t);
    g.gain.setValueAtTime(0.0001,a.currentTime+t); g.gain.exponentialRampToValueAtTime(vol||0.18,a.currentTime+t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,a.currentTime+t+d);
    o.connect(g); g.connect(a.destination); o.start(a.currentTime+t); o.stop(a.currentTime+t+d+0.02); }
  function sTick(){ tone(880+Math.random()*220,0,0.05,'square',0.08); }
  function sWin(){ [523,659,784,1047].forEach(function(f,i){ tone(f,i*0.11,0.22,'triangle',0.22); }); [1047,1319,1568].forEach(function(f){ tone(f,0.5,0.9,'triangle',0.16); });
    var a=ac(); if(!a||MUTE) return; var n=a.createBufferSource(), b=a.createBuffer(1,a.sampleRate*0.6,a.sampleRate), d=b.getChannelData(0); for(var i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
    var g=a.createGain(); g.gain.value=0.12; n.buffer=b; n.connect(g); g.connect(a.destination); n.start(a.currentTime+0.45); }
  function sPop(){ tone(660,0,0.08,'sine',0.2); tone(990,0.07,0.12,'sine',0.18); }
  function sLose(){ tone(392,0,0.18,'triangle',0.15); tone(330,0.16,0.3,'triangle',0.13); }

  /* ---- 꽃가루 ---- */
  var cv=$('fx'), cx=cv.getContext('2d'), P=[];
  function size(){ cv.width=innerWidth; cv.height=innerHeight; } size(); addEventListener('resize',size);
  function burst(n){
    var col=['#ffd978','#ff9bd2','#8fd3ff','#b6ff9b','#ffffff','#f5b93a'];
    for(var k=0;k<n;k++) P.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.45,vx:(Math.random()-.5)*16,vy:-Math.random()*16-6,r:Math.random()*6+4,c:col[k%col.length],a:Math.random()*6,s:(Math.random()-.5)*.3,life:200});
    if(!burst.on){ burst.on=true; requestAnimationFrame(step); }
  }
  function step(){
    cx.clearRect(0,0,cv.width,cv.height);
    P=P.filter(function(p){ return p.life-->0 && p.y<cv.height+30; });
    P.forEach(function(p){ p.vy+=.35; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.s; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a); cx.fillStyle=p.c; cx.fillRect(-p.r,-p.r/2,p.r*2,p.r); cx.restore(); });
    if(P.length) requestAnimationFrame(step); else { burst.on=false; cx.clearRect(0,0,cv.width,cv.height); }
  }

  $('rst').onclick=function(){
    if(spinning) return;
    var a=prompt('초기화할 것을 숫자로 넣어 주세요.\n1 = 당첨 기록만 지우기 (참가자는 그대로, 다시 추첨)\n2 = 참가자와 당첨 모두 지우기 (처음부터)','1');
    if(a!=='1'&&a!=='2') return;
    if(!confirm(a==='2'?'참가자와 당첨 기록을 모두 지울까요? 되돌릴 수 없어요.':'당첨 기록을 모두 지울까요?')) return;
    google.script.run.withSuccessHandler(function(r){ if(!r.ok){ alert(r.msg); return; } ST=r.stage; slotsFor(1); $('dept').textContent='초기화했어요'; render(); }).resetData(PW, a==='2'?'all':'wins');
  };
  $('snd').onclick=function(){ MUTE=!MUTE; this.textContent=MUTE?'🔇 소리 꺼짐':'🔊 소리 켜짐'; if(!MUTE){ ac(); sPop(); } };
  google.script.url.getLocation(function(loc){ if(loc.parameter && loc.parameter.admin) startStage(loc.parameter.admin); });
</script>
</body>
</html>
