.wrap{max-width:1180px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left,0px)) 60px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.eyebrow{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:800}

.live{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:12px 0 18px;font-size:.92rem}

.live button{font:inherit;font-weight:700;border:0;border-radius:8px;padding:7px 12px;cursor:pointer;background:var(--acc);color:#fff}
.live button.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.tag{margin-left:auto;font-size:.8rem;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kpi small{color:var(--mut);font-weight:700}.kpi b{display:block;font-size:2.2rem;line-height:1.15;margin-top:4px;font-variant-numeric:tabular-nums}.kpi span{color:var(--mut);font-size:.88rem}
.kpi.bump b{animation:bump .6s}@keyframes bump{40%{transform:scale(1.12);color:var(--acc)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.card h3{margin:0 0 8px;font-size:1.02rem}.card .cv{position:relative;height:250px}.card p.ins{margin:10px 0 0;font-size:.9rem;color:var(--mut);border-top:1px dashed var(--line);padding-top:8px}
.decide{margin-top:18px;background:var(--dec);color:var(--decfg);border-radius:16px;padding:20px 22px}
.decide h2{margin:0 0 10px;font-size:1.25rem}.decide ol{margin:0;padding-left:20px;line-height:1.9}
.voices{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.voices div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:.92rem}
.voices div.new{outline:2px solid var(--acc)}
.foot{margin-top:24px;color:var(--mut);font-size:.82rem}
